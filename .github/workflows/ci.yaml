name: App image deploy CI
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
    IMAGE:
        name: IMAGE
        value: docker.io/charungooa/flask-microservice

jobs:
   build-push:
     runs-on: ubuntu-latest
     steps:
         - name: Checkout code
           uses: actions/checkout@v4

         - name: Set up Docker Buildx
           uses: docker/setup-buildx-action@v3

         - name: Log in to DockerHub
           uses: docker/login-action@v3
           with:
             username: ${{ secrets.DOCKERHUB_USERNAME }}
             password: ${{ secrets.DOCKERHUB_TOKEN }}

         - name: Build and push Docker image (unique SHA tag)
           uses: docker/build-push-action@v6
           with:
             context: .
             push: true
             tags: |
                ${{ env.IMAGE }}:${{ github.sha }}
                ${{ env.IMAGE }}:latest

         - name: checkout Gitops repo
           uses: actions/Checkout@v4
           with:
             repository: charungooa/gitops
             token: ${{ secrets.GITOPS_PAT}}
             path: gitops

         - name: Patch HelmRelease image  tag (dev)
           run: |
                cd gitops
                sudo snap install yq || true
                yq -i '.spec.values.image.tag = "${{ github.sha}}"' \
                   clusters/dev/flask-helmrelease.yaml
                git config user.name  "ci-bot"
                git config user.email "ci-bot@users.noreply.github.com"
                git add clusters/dev/flask-helmrelease.yaml
                git commit -m "dev: bump flask-microservice image to ${{ github.sha}}"  || echo "No changes to commit"
                git push